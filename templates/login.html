{% extends "base.html" %}
{% block titulo %}Ingreso — Taquilla{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-boleto">
        <span class="eyebrow">Acceso Privado</span>
        <h1 class="login-titulo">Taquilla</h1>
        <p class="login-evento">Gestión de Entradas</p>
        <div class="perforacion"></div>

        <p class="login-sub">Ingresá tu usuario y contraseña</p>
        <input type="text" id="usuario" class="login-input" placeholder="USUARIO" autocomplete="username" autocapitalize="none">
        <input type="password" id="password" class="login-input" placeholder="CONTRASEÑA" autocomplete="current-password">
        <button class="btn-primario" id="btnLogin">Entrar</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>
{% endblock %}
{% block estilos %}
<style>
    .login-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
        padding-top: 5vh;
    }

    .login-boleto {
        position: relative;
        width: 100%;
        max-width: 340px;
        background: var(--negro-2);
        border: 1px dashed rgba(217, 255, 61, 0.35);
        border-radius: 20px;
        padding: 36px 28px 28px;
        text-align: center;
        animation: sube 0.6s var(--cubic) both;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    }

    /* Muescas de talon perforado */
    .login-boleto::before,
    .login-boleto::after {
        content: '';
        position: absolute;
        top: 96px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--negro);
    }

    .login-boleto::before { left: -12px; }
    .login-boleto::after { right: -12px; }

    .login-titulo {
        font-family: 'Archivo Black', sans-serif;
        font-size: 2.3rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 12px 0 2px;
        color: var(--texto);
    }

    .login-evento {
        font-family: 'Space Mono', monospace;
        font-size: 0.62rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--lima);
        margin-bottom: 4px;
    }

    .perforacion {
        border-top: 2px dashed rgba(255, 255, 255, 0.14);
        margin: 20px 0;
    }

    .login-sub {
        font-size: 0.85rem;
        color: var(--texto-suave);
        margin-bottom: 18px;
    }

    .login-input {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 14px;
        font-family: 'Space Mono', monospace;
        font-size: 0.95rem;
        text-align: center;
        letter-spacing: 0.12em;
        color: var(--texto);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--linea);
        border-radius: 10px;
        outline: none;
        transition: all 0.35s var(--cubic);
    }

    .login-input:focus {
        border-color: var(--lima);
        background: rgba(217, 255, 61, 0.05);
        box-shadow: 0 0 0 3px rgba(217, 255, 61, 0.12);
    }

    .login-error {
        min-height: 20px;
        margin-top: 12px;
        font-family: 'Space Mono', monospace;
        font-size: 0.72rem;
        color: var(--rojo);
        letter-spacing: 0.05em;
    }
</style>
{% endblock %}
{% block scripts %}
<script>
    const usuario = document.getElementById('usuario');
    const input = document.getElementById('password');
    const btn = document.getElementById('btnLogin');
    const error = document.getElementById('loginError');

    async function entrar() {
        const user = usuario.value.trim();
        const pass = input.value;
        if (!user || !pass) { error.textContent = 'Ingresá usuario y contraseña'; return; }
        btn.disabled = true;
        btn.textContent = 'Entrando...';
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: user, password: pass })
            });
            const data = await res.json();
            if (res.ok && data.ok) {
                try{ sessionStorage.clear(); }catch{}
                location.href = data.destino || ('/' + data.rol);
            } else {
                error.textContent = data.error || 'Error al ingresar';
                btn.disabled = false;
                btn.textContent = 'Entrar';
                input.value = '';
                input.focus();
            }
        } catch (err) {
            error.textContent = 'Error de conexión';
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    }

    btn.addEventListener('click', entrar);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
    usuario.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.focus(); });
    usuario.focus();
</script>
{% endblock %}
