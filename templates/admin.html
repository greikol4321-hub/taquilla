{% extends "base.html" %}
{% block titulo %}Admin - {{ nombre_evento }}{% endblock %}

{% block estilos %}
<style>
    .admin-grid { width: 100%; display: flex; flex-direction: column; gap: 22px; }

    .panel {
        background: var(--negro-2);
        border: 1px solid var(--linea);
        border-radius: 16px;
        padding: 18px;
        animation: pop 0.5s var(--cubic) both;
    }

    .panel h2 {
        font-family: 'Archivo Black', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
    }

    .panel h2 .count {
        font-family: 'Space Mono', monospace;
        font-size: 0.68rem;
        color: var(--lima);
        background: var(--lima-suave);
        padding: 2px 10px;
        border-radius: 999px;
    }

    .filtro {
        width: 100%;
        padding: 10px 14px;
        background: var(--negro);
        border: 1px solid var(--linea);
        border-radius: 10px;
        color: var(--texto);
        font-family: 'Space Mono', monospace;
        font-size: 0.72rem;
        margin-bottom: 12px;
        outline: none;
    }

    .filtro:focus { border-color: var(--lima); }

    .tabla-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }

    th {
        font-family: 'Space Mono', monospace;
        font-size: 0.58rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--texto-suave);
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--linea);
        white-space: nowrap;
    }

    td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--linea);
        vertical-align: top;
        color: var(--texto);
    }

    tr:last-child td { border-bottom: none; }

    .chip {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-family: 'Space Mono', monospace;
        font-size: 0.58rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid var(--linea);
        color: var(--texto-suave);
        white-space: nowrap;
    }

    .chip.venta { color: var(--lima); border-color: rgba(217, 255, 61, 0.4); }
    .chip.escaneo { color: #7cc4ff; border-color: rgba(124, 196, 255, 0.4); }
    .chip.borrado_total { color: var(--rojo); border-color: rgba(255, 77, 77, 0.4); }
    .chip.login, .chip.logout { color: #c9a2ff; border-color: rgba(201, 162, 255, 0.4); }
    .chip.user_crear, .chip.user_editar, .chip.user_borrar { color: #ffd166; border-color: rgba(255, 209, 102, 0.4); }

    .detalle { color: var(--texto-suave); font-size: 0.7rem; max-width: 260px; }

    .fecha { font-family: 'Space Mono', monospace; font-size: 0.62rem; color: var(--texto-suave); white-space: nowrap; }

    .acciones { display: flex; gap: 6px; }

    .btn-mini {
        background: transparent;
        border: 1px solid var(--linea);
        color: var(--texto-suave);
        padding: 5px 11px;
        border-radius: 999px;
        font-family: 'Space Mono', monospace;
        font-size: 0.6rem;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: all 0.3s var(--cubic);
        white-space: nowrap;
    }

    .btn-mini:hover { border-color: var(--lima); color: var(--lima); }
    .btn-mini.rojo:hover { border-color: var(--rojo); color: var(--rojo); }

    .form-user {
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--linea);
    }

    .form-user input, .form-user select {
        width: 100%;
        padding: 11px 14px;
        background: var(--negro);
        border: 1px solid var(--linea);
        border-radius: 10px;
        color: var(--texto);
        font-family: 'Space Mono', monospace;
        font-size: 0.72rem;
        outline: none;
    }

    .form-user input:focus, .form-user select:focus { border-color: var(--lima); }

    .form-user .fila { display: flex; gap: 9px; }

    .form-user .fila input[type="text"], .form-user .fila input[type="password"] { flex: 1; }

    .empty { text-align: center; color: var(--texto-suave); font-family: 'Space Mono', monospace; font-size: 0.68rem; padding: 18px 0; }

    @media (max-width: 380px) {
        .form-user .fila { flex-direction: column; }
    }
</style>
{% endblock %}

{% block content %}
<div class="admin-grid">
    <section class="panel" style="animation-delay:0s">
        <h2><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--lima)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg> Usuarios <span class="count" id="countUsers">0</span></h2>

        <form class="form-user" id="formUser">
            <div class="fila">
                <input type="text" id="uNombre" placeholder="Nombre (opcional)">
            </div>
            <div class="fila">
                <input type="text" id="uUsuario" placeholder="Usuario" autocomplete="off">
                <input type="password" id="uPassword" placeholder="Contraseña" autocomplete="new-password">
            </div>
            <div class="fila">
                <select id="uRol">
                    <option value="vendedor">Vendedor</option>
                    <option value="portero">Portero</option>
                    <option value="admin">Admin</option>
                </select>
                <button class="btn-primario" type="submit" style="padding:12px;font-size:0.8rem">Crear usuario</button>
            </div>
        </form>

        <div class="tabla-wrap">
            <table>
                <thead>
                    <tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th></th></tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>
    </section>

    <section class="panel" style="animation-delay:0.06s">
        <h2><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--lima)"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg> Registro de actividad <span class="count" id="countLogs">0</span></h2>
        <input class="filtro" id="filtroLogs" placeholder="Filtrar por usuario, acción o detalle…">
        <div class="tabla-wrap">
            <table>
                <thead>
                    <tr><th>Fecha</th><th>Acción</th><th>Detalle</th><th>Usuario</th></tr>
                </thead>
                <tbody id="logsBody"></tbody>
            </table>
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
    const ACCIONES = {
        'venta': 'Venta',
        'escaneo': 'Escaneo',
        'login': 'Login',
        'logout': 'Logout',
        'borrado_total': 'Borrado total',
        'revertir_escaneo': 'Revertir escaneo',
        'exportar_csv': 'Exportar CSV',
        'user_crear': 'Crear usuario',
        'user_editar': 'Editar usuario',
        'user_borrar': 'Borrar usuario'
    };

    async function api(url, opciones = {}) {
        const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opciones });
        return r.json();
    }

    function chipClase(accion) {
        if (['user_crear', 'user_editar', 'user_borrar'].includes(accion)) return 'user_crear';
        return accion;
    }

    function formatearFecha(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const pad = n => String(n).padStart(2, '0');
        return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    async function cargarLogs() {
        const data = await api('/api/logs');
        document.getElementById('countLogs').textContent = data.logs ? data.logs.length : 0;
        const filtro = document.getElementById('filtroLogs').value.trim().toLowerCase();
        const body = document.getElementById('logsBody');
        body.innerHTML = '';
        const logs = (data.logs || []).filter(l =>
            !filtro ||
            (l.usuario || '').toLowerCase().includes(filtro) ||
            (l.accion || '').toLowerCase().includes(filtro) ||
            (l.detalle || '').toLowerCase().includes(filtro)
        );
        if (!logs.length) {
            body.innerHTML = '<tr><td colspan="4" class="empty">Sin registros</td></tr>';
            return;
        }
        for (const l of logs) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="fecha">${formatearFecha(l.creado_en)}</td>
                <td><span class="chip ${chipClase(l.accion)}">${ACCIONES[l.accion] || l.accion}</span></td>
                <td class="detalle"></td>
                <td style="font-family:'Space Mono',monospace;font-size:0.66rem;white-space:nowrap">${l.usuario || ''}</td>`;
            tr.querySelector('.detalle').textContent = l.detalle || '';
            body.appendChild(tr);
        }
    }

    async function cargarUsers() {
        const data = await api('/api/users');
        document.getElementById('countUsers').textContent = data.users ? data.users.length : 0;
        const body = document.getElementById('usersBody');
        body.innerHTML = '';
        for (const u of data.users || []) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-family:'Space Mono',monospace;font-size:0.66rem">${u.usuario}</td>
                <td class="detalle" style="max-width:140px"></td>
                <td><span class="chip ${u.rol === 'admin' ? 'user_crear' : u.rol}">${u.rol}</span></td>
                <td><div class="acciones">
                    <button class="btn-mini" data-edit="${u.id}">Editar</button>
                    <button class="btn-mini rojo" data-del="${u.id}">Borrar</button>
                </div></td>`;
            tr.querySelector('.detalle').textContent = u.nombre || '';
            body.appendChild(tr);
        }
    }

    document.getElementById('formUser').addEventListener('submit', async e => {
        e.preventDefault();
        const data = await api('/api/users', {
            method: 'POST',
            body: JSON.stringify({
                usuario: document.getElementById('uUsuario').value,
                password: document.getElementById('uPassword').value,
                rol: document.getElementById('uRol').value,
                nombre: document.getElementById('uNombre').value
            })
        });
        if (data.ok) {
            document.getElementById('uUsuario').value = '';
            document.getElementById('uPassword').value = '';
            document.getElementById('uNombre').value = '';
            mostrarToast('Usuario creado');
            cargarUsers(); cargarLogs();
        } else {
            mostrarToast(data.error || 'Error');
        }
    });

    document.getElementById('usersBody').addEventListener('click', async e => {
        const btn = e.target.closest('button[data-edit], button[data-del]');
        if (!btn) return;
        const id = btn.dataset.edit || btn.dataset.del;
        if (btn.dataset.del) {
            if (!confirm('¿Borrar este usuario?')) return;
            const data = await api(`/api/users/${id}`, { method: 'DELETE' });
            if (data.ok) { mostrarToast('Usuario borrado'); cargarUsers(); cargarLogs(); }
            else mostrarToast(data.error || 'Error');
            return;
        }
        const nuevoRol = prompt('Nuevo rol (vendedor, portero o admin):');
        if (nuevoRol === null) return;
        const nuevaPass = prompt('Nueva contraseña (vacío = no cambiar):');
        const body = { rol: nuevoRol.trim().toLowerCase() };
        if (nuevaPass && nuevaPass.trim()) body.password = nuevaPass.trim();
        const data = await api(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify(body) });
        if (data.ok) { mostrarToast('Usuario editado'); cargarUsers(); cargarLogs(); }
        else mostrarToast(data.error || 'Error');
    });

    document.getElementById('filtroLogs').addEventListener('input', cargarLogs);

    cargarLogs();
    cargarUsers();
    setInterval(cargarLogs, 15000);
</script>
{% endblock %}
